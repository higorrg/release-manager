# Configurações para testes de integração
quarkus.log.level=INFO
#quarkus.log.category."org.testcontainers".level=DEBUG

# Configurações de TestContainers
quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.flyway.migrate-at-start=true

# Configurações OIDC/Keycloak para testes
quarkus.oidc.enabled=true
quarkus.oidc.application-type=service
quarkus.oidc.client-id=test-client
quarkus.oidc.credentials.secret=test-secret
app.security.authorization.enabled=true

# Configurações Keycloak TestContainer estáticas
keycloak.realm=test
keycloak.client-id=test-client
keycloak.client-secret=test-secret
keycloak.admin-username=admin
keycloak.admin-password=admin