# Configuração do TestContainers para usar Podman
docker.host=unix:///run/user/1000/podman/podman.sock
# Alternativa se o socket acima não funcionar:
# docker.host=unix:///var/run/docker.sock

# Para sistemas usando Podman, descomente as linhas abaixo:
testcontainers.reuse.enable=true
ryuk.disabled=true
testcontainers.ryuk.disabled=true